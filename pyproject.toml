[project]
name = "carbon-mcp"
version = "0.1.0"
description = "MCP server for early-design embodied-carbon calculations (A1–A3, A4, EN 16449) with ÖKOBAUDAT lookups"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
carbon-mcp = "carbon_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbon_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["live: calls the real ÖKOBAUDAT API (run with -m live)"]
addopts = "-m 'not live'"
